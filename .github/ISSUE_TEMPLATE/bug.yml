name: Bug report
description: Report a reproducible defect in dsh-sherlock
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, cookies, private profile data, or security vulnerabilities here. See SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact tool call/arguments and the observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dsh-sherlock version
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: "0.2.2-rc.1"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - core
        - all
        - explicit sites
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact tokens and personal data.
