name: Publish npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No `registry-url`: it writes an empty _authToken into .npmrc, which
          # prevents npm from performing the OIDC trusted-publishing exchange.
          cache: npm
      - name: Install dev tooling
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Data validation
        run: npm run check
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: Publish
        run: npm publish --provenance --access public
